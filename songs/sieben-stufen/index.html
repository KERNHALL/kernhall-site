<h1>SIEBEN STUFEN</h1>
<p class="song-date">Release: <time datetime="2027-01-29">29.01.2027</time></p>
<p>Dante lässt mit Vergil die Hölle hinter sich. Auf dem Läuterungsberg führt der Weg durch Rauch und Feuer, bis Dante Beatrice gegenübersteht und ausspricht, was er mit sich trägt. Melodischer Metalcore mit Geige nach Dantes <em>Purgatorio</em>.</p>
<p lang="en">Dante leaves Hell behind with Virgil. The climb takes him through smoke and fire until he faces Beatrice and gives voice to what he has been carrying. Melodic metalcore with violin, inspired by Dante’s <em>Purgatorio</em>.</p>
