<h1>DAS LETZTE LICHT</h1>
<p class="song-date">Release: <time datetime="2027-02-05">05.02.2027</time></p>
<p>Beatrice führt Dante durch die Himmelssphären. Die Erde wird unter ihm immer kleiner. Jenseits der letzten Sphäre erkennt er im Licht, was die Welt zusammenhält und auch ihn bewegt. Dunkler Metalcore mit Geige nach Dantes <em>Paradiso</em> und der Abschluss der Trilogie nach NEUN KREISE und SIEBEN STUFEN.</p>
<p lang="en">Beatrice guides Dante through the celestial spheres. The Earth grows smaller beneath him. Beyond the final sphere, he sees in the light what holds the world together and moves him too. Dark metalcore with violin, inspired by Dante’s <em>Paradiso</em>, closes the trilogy after NEUN KREISE and SIEBEN STUFEN.</p>
