<h1>ICH SEHE DICH</h1>
<p class="song-date">Release: <time datetime="2026-12-11">11.12.2026</time></p>
<p>Ein Schatten hinter der Tür und eine Erinnerung, die sich mit jedem Versuch, sie festzuhalten, verändert. Später sitzt da eine makellose Gestalt: kein Zittern, kein Fehler im Blick. Zwischen Glas, Linsen und falschen Gewissheiten fragt ICH SEHE DICH, wie sehr wir den eigenen Augen trauen können. Düsterer deutschsprachiger Industrial Metal und Metalcore.</p>
<p lang="en">A shadow behind a door and a memory that changes every time it is recalled. Later, an impossibly perfect figure sits opposite: no flicker, no flaw in its gaze. Through glass, lenses and unreliable certainty, ICH SEHE DICH asks how much we can trust our own eyes. Dark German industrial metal and metalcore.</p>
