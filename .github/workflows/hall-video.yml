name: HALL Stock Footage Video Render
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/hall-video/**'
      - '.github/workflows/hall-video.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download licensed stock clips and render each once
        env:
          HALL_TEST: '1'
        run: python3 tools/hall-video/render.py
      - name: Upload rendered video and sources
        uses: actions/upload-artifact@v4
        with:
          name: HALL-FOOTAGE-RENDER
          path: |
            HALL-FOOTAGE-ONLY-1080p.mp4
            HALL-FOOTAGE-LICENSE-SOURCES.json
          retention-days: 7
